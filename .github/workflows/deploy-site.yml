# Deploy aventary.com (the Next app) to its Cloudflare Worker.
#
# WHY THIS IS MANUAL-ONLY
# Cloudflare Workers Builds owns automatic deploys: it is connected to this repo,
# builds every push, and reports back on pull requests with a preview URL — which
# is better than this workflow, because you see the result before merging rather
# than after.
#
# So this does NOT run on push. Two pipelines deploying the same Worker would race
# each other on every merge. It stays as a manual escape hatch for when the
# Cloudflare build is unavailable or needs bypassing: Actions -> Deploy
# aventary.com -> Run workflow.
#
# SETUP, only if you ever need to run it (repo Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN    needs "Edit Cloudflare Workers" (the sofajcc deploy
#                           already uses this secret; a Workers-scoped token
#                           covers both)
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare dashboard -> Workers & Pages -> Account ID
#
# Encrypted SECRETS (SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY, PAGE_FEED_SECRET)
# are set in Cloudflare and are NOT touched by a deploy.
#
# PLAIN-TEXT variables are a different story, and this comment used to get it
# wrong: a deploy REPLACES them with whatever wrangler.jsonc declares, so
# declaring none removes every one that was added in the dashboard. That is
# exactly how sign-in email died twenty minutes after being fixed by hand.
# Non-secret config therefore lives in wrangler.jsonc's `vars` block, where a
# deploy restores it. Do not set plain-text vars in the dashboard.

name: Deploy aventary.com

on:
  workflow_dispatch:        # manual only — Cloudflare Workers Builds handles pushes

concurrency:
  # A newer push supersedes an in-flight deploy rather than racing it.
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the required secrets are present
        run: |
          missing=
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # NEXT_PUBLIC_* values are compiled into the bundle at BUILD time, and a CI
      # runner has no .env — so without this step the browser bundle ships with
      # them undefined. Every deploy before this one came off a laptop where .env
      # supplied them, which is why nobody noticed.
      #
      # Read from wrangler.jsonc so there is exactly one source of truth: change
      # a value there and both the build and the Worker runtime follow. The
      # comment stripper is line-anchored on purpose — a naive s|//.*|| would eat
      # the https:// inside the URL itself.
      - name: Export the public build-time env from wrangler.jsonc
        run: |
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("wrangler.jsonc", "utf8");
            const vars = JSON.parse(raw.replace(/^\s*\/\/.*$/gm, "")).vars ?? {};
            const need = ["NEXT_PUBLIC_SUPABASE_URL", "NEXT_PUBLIC_SUPABASE_ANON_KEY"];
            const missing = need.filter((k) => !vars[k]);
            if (missing.length) {
              console.error(`::error::wrangler.jsonc vars is missing: ${missing.join(", ")}`);
              process.exit(1);
            }
            for (const [k, v] of Object.entries(vars)) {
              if (k.startsWith("NEXT_PUBLIC_")) fs.appendFileSync(process.env.GITHUB_ENV, `${k}=${v}\n`);
            }
          '

      # Build before deploying so a broken build fails here, loudly, instead of
      # silently leaving the last good version live with no sign anything went wrong.
      - name: Build the Worker bundle
        run: npm run cf:build

      - name: Sanity-check the bundle
        run: |
          test -f .open-next/worker.js || { echo "::error::.open-next/worker.js missing — refusing to deploy"; exit 1; }
          test -d .open-next/assets    || { echo "::error::.open-next/assets missing — refusing to deploy"; exit 1; }

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
